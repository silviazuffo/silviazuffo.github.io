<style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var H = document.documentElement;
  var $ = function (id) { return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';

  var ICONES = {
    folha: '<svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14z"/><path d="M5 19l7-7"/></svg>',
    ondas: '<svg viewBox="0 0 24 24"><path d="M3 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>'
      + '<path d="M3 13c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>',
    coracao: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.400-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/></svg>',
    brilho: '<svg viewBox="0 0 24 24"><path d="M11 3l1.800 5.200L18 10l-5.200 1.800L11 17l-1.800-5.200L4 10l5.200-1.800z"/>'
      + '<path d="M18.500 15.500l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>',
    rosto: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/>'
      + '<path d="M8.500 14.200c1 1.400 2.200 2.100 3.500 2.100s2.500-.7 3.500-2.100"/></svg>'
  };

  document.title = CONFIG.nome + ' · Massoterapeuta · Francisco Beltrão';
  $('etiqueta').innerHTML = '<b>' + CONFIG.profissao + '</b> · ' + CONFIG.localidade;
  $('frase').textContent = CONFIG.frase;
  $('destaque').textContent = CONFIG.fraseDestaque;
  $('sub').textContent = CONFIG.sub;
  $('dica').textContent = CONFIG.dica;
  $('excl').textContent = CONFIG.exclusivo;
  $('fecha').textContent = CONFIG.fechamento;
  /* mobile: titulos em uma linha so (reduz a fonte ate caber) */
  function ajustar() {
    var els = [$('etiqueta'), document.querySelector('h1'), $('sub')];
    els.forEach(function (el) {
      el.style.fontSize = '';
      if (window.innerWidth >= 700) return;
      var max = el.parentNode.clientWidth - (el === els[0] ? 56 : 4);
      var fs = parseFloat(getComputedStyle(el).fontSize);
      el.style.display = 'inline-block'; el.style.width = 'auto';
      while (el.scrollWidth > max && fs > 9) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
      el.style.display = ''; el.style.width = '';
    });
  }
  window.addEventListener('resize', ajustar);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar);
  ajustar();
  $('insta').href = CONFIG.instagram;
  $('mapa').href = CONFIG.mapa;
  function zapLink(msg) { return 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(msg); }
  $('zap').href = zapLink(CONFIG.mensagemPadrao);
  $('centro').innerHTML = '<img src="data:image/jpeg;base64,' + ARTE.logo + '" alt="' + CONFIG.nome + '">';

  var cats = CONFIG.categorias, n = cats.length, R = 38;
  var RC = 17.5, RN = 12.5;            /* raio do círculo central e das bolas (em % do palco) */
  var FOLGA = (2 * Math.asin(RN / (2 * R)) * 180 / Math.PI) / 2 + 1.5;   /* meia abertura do anel nas bolas */
  function pt(r, a) { return [50 + r * Math.cos(a), 50 + r * Math.sin(a)]; }
  var DEG = Math.PI / 180;
  cats.forEach(function (c, i) {
    var a0 = (-90 + i * (360 / n)) * DEG, a1 = (-90 + (i + 1) * (360 / n)) * DEG;
    /* anel: só o trecho entre uma bola e a próxima (nunca passa por trás das bolas) */
    var s = pt(R, a0 + FOLGA * DEG), e = pt(R, a1 - FOLGA * DEG);
    var arco = document.createElementNS(NS, 'path');
    arco.setAttribute('class', 'anel');
    arco.setAttribute('d', 'M' + s[0].toFixed(2) + ',' + s[1].toFixed(2) + ' A' + R + ',' + R + ' 0 0 1 '
      + e[0].toFixed(2) + ',' + e[1].toFixed(2));
    $('aneis').appendChild(arco);
  });
  cats.forEach(function (c, i) {
    var ang = (-90 + i * (360 / n)) * DEG;
    var x = 50 + R * Math.cos(ang), y = 50 + R * Math.sin(ang);
    var ini = pt(RC, ang), fim = pt(R - RN, ang);   /* o fio vai da borda do centro até a borda da bola */

    var fio = document.createElementNS(NS, 'line');
    fio.setAttribute('class', 'fio');
    fio.setAttribute('x1', ini[0].toFixed(2)); fio.setAttribute('y1', ini[1].toFixed(2));
    fio.setAttribute('x2', fim[0].toFixed(2)); fio.setAttribute('y2', fim[1].toFixed(2));
    $('fios').appendChild(fio);

    var p = document.createElementNS(NS, 'circle');
    p.setAttribute('class', 'ponto'); p.setAttribute('r', '.7');
    var m = document.createElementNS(NS, 'animateMotion');
    m.setAttribute('dur', (4 + i * .7) + 's'); m.setAttribute('repeatCount', 'indefinite');
    m.setAttribute('path', 'M' + ini[0].toFixed(2) + ',' + ini[1].toFixed(2) + ' L' + fim[0].toFixed(2) + ','
      + fim[1].toFixed(2));
    p.appendChild(m); $('pontos').appendChild(p);

    var b = document.createElement('button');
    b.type = 'button'; b.className = 'no';
    b.style.left = 'calc(' + x.toFixed(2) + '% - 12%)'; b.style.top = 'calc(' + y.toFixed(2) + '% - 12%)';
    b.innerHTML = ICONES[c.icone] + '<span></span>';
    b.querySelector('span').textContent = c.nome;
    b.setAttribute('aria-label', c.titulo);
    b.addEventListener('click', function () { abreCategoria(c); });
    $('palco').appendChild(b);
  });

  function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  function mini(icone, nome) {
    $('mini').innerHTML = '<div class="lg"><img alt="' + CONFIG.nome + '" src="data:image/jpeg;base64,' + ARTE.logo + '"></div>'
      + '<div class="liga"><svg aria-hidden="true"><line x1="0" y1="5" x2="100%" y2="5"/></svg><i></i></div>'
      + '<div class="nd">' + icone + '<span>' + esc(nome) + '</span></div>';
  }
  function abreCategoria(c) {
    mini(ICONES[c.icone], c.nome);
    $('ct').textContent = c.titulo;
    var h = '<p class="intro">' + esc(c.texto) + '</p>';
    c.tratamentos.forEach(function (t) {
      var link = zapLink('Olá, Silvia! Quero agendar: ' + t.nome + '.');
      h += '<article class="trat">'
        + '<img class="foto" alt="' + esc(t.nome) + '" loading="lazy" src="data:image/jpeg;base64,'
        + ARTE.fotos[t.foto] + '">'
        + '<h3>' + esc(t.nome) + '</h3><p>' + esc(t.texto) + '</p><ul>'
        + t.itens.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('')
        + '</ul><div class="frase">' + esc(t.frase) + '</div>'
        + '<a class="agendar" target="_blank" rel="noopener" href="' + link + '">Agendar este atendimento</a>'
        + '</article>';
    });
    $('cc').innerHTML = h;
    $('cz').href = zapLink('Olá, Silvia! Tenho interesse em: ' + c.titulo + '.');
    abre();
  }
  $('sobre').addEventListener('click', function () {
    mini('<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.600"/><path d="M5 20c.6-3.800 3.400-6 7-6s6.400 2.200 7 6"/></svg>', 'Sobre mim');
    $('ct').textContent = CONFIG.sobreMim.titulo;
    $('cc').innerHTML = '<div class="sobre">' + CONFIG.sobreMim.html + '</div>';
    $('cz').href = zapLink(CONFIG.mensagemPadrao);
    abre();
  });
  function abre() { $('cartao').scrollTop = 0; H.classList.add('aberto'); }
  function fechar() { H.classList.remove('aberto'); }
  $('fechar').addEventListener('click', fechar);
  $('fundo').addEventListener('click', fechar);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fechar(); });

  function aplicaTema(t) {
    H.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', t === 'dark' ? '#14211a' : '#f0eeef');
  }
  try {
    var salvo = localStorage.getItem('silvia-tema');
    if (salvo === 'light' || salvo === 'dark') aplicaTema(salvo);
  } catch (e) {}
  $('tema').addEventListener('click', function () {
    var t = H.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    aplicaTema(t);
    try { localStorage.setItem('silvia-tema', t); } catch (e) {}
  });

  var svg = document.querySelector('svg.rede');
  document.addEventListener('visibilitychange', function () {
    H.classList.toggle('pausa', document.hidden);
    try { document.hidden ? svg.pauseAnimations() : svg.unpauseAnimations(); } catch (e) {}
  });
});
</script>
